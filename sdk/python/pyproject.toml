[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ipvn7-sdk"
version = "0.7.0"
description = "Python Client SDK for IPVN7 Sovereign Network OS"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "IPVN7 Architecture Group" }]
dependencies = [
    "cbor2>=5.4.0",
    "requests>=2.28.0",
]
